# Builds linuxcnc-ecat_*.deb (the ecat HAL component and the ecatsetup
# command) for Debian 12 and 13, with scripts/build-deb.sh.
#
# - "Run workflow" on the Actions tab: the packages are kept as artifacts of
#   the run (90 days, downloadable when logged in).
# - A pushed tag ecat-v* (git tag ecat-v0.1 && git push github ecat-v0.1):
#   the packages are also put on a pre-release for the tag. The prefix keeps
#   these apart from the v* tags of lcec's history.
#
# The package is built against the userspace master package
# linuxcnc-ethercat-uspace from a uspace-v* release of MetalMusings/ethercat
# (1.1 or later) and LinuxCNC 2.10. There are no 2.10 packages for Debian 12
# or 13 yet (buildbot.linuxcnc.org is gone), so LinuxCNC is built from source
# at a pinned commit (LINUXCNC_COMMIT, moved on purpose only: the HAL API
# changed as late as October 2026), without its GUIs and manual pages: ecat
# needs only halcompile, the headers and the HAL library. The build is cached.

name: Package

on:
  workflow_dispatch:
    inputs:
      master_release:
        description: uspace-v* release of MetalMusings/ethercat with the master package (1.1 or later)
        default: uspace-v1.1
  push:
    tags: ['ecat-v*']

permissions:
  contents: read

env:
  MASTER_RELEASE: ${{ inputs.master_release || 'uspace-v1.1' }}
  LINUXCNC_COMMIT: b0e7b191b92066c771f2063714dc00736899ec95  # 2.10.0~pre2-436, 2026-11-12

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: bookworm
            id: debian12
          - debian: trixie
            id: debian13
    container: debian:${{ matrix.debian }}
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git dpkg-dev libyaml-dev python3 python3-yaml \
            ca-certificates curl gnupg dirmngr \
            autoconf automake pkg-config python3-dev python3-pybind11 \
            libboost-python-dev libfmt-dev libtirpc-dev libcap-dev libgpiod-dev \
            libusb-1.0-0-dev libmodbus-dev libudev-dev libedit-dev \
            tcl8.6-dev tk8.6-dev tclx bwidget python3-tk libxmu-dev libgl-dev \
            libglu1-mesa-dev libepoxy-dev intltool \
            libglib2.0-dev yapps2 procps psmisc kmod gawk

      - uses: actions/cache@v4
        id: linuxcnc
        with:
          path: /opt/linuxcnc-src
          key: linuxcnc-${{ matrix.id }}-${{ env.LINUXCNC_COMMIT }}

      - name: LinuxCNC 2.10 from source (run-in-place, only what ecat needs)
        if: steps.linuxcnc.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/LinuxCNC/linuxcnc /opt/linuxcnc-src
          cd /opt/linuxcnc-src
          git checkout -q "$LINUXCNC_COMMIT"
          cd src
          ./autogen.sh
          ./configure --with-realtime=uspace --disable-nls --disable-manpages \
            --disable-gui --disable-gtk
          make -j"$(nproc)"

      - name: linuxcnc-ethercat-uspace from ${{ env.MASTER_RELEASE }}
        run: |
          url=$(curl -fsSL "https://api.github.com/repos/MetalMusings/ethercat/releases/tags/$MASTER_RELEASE" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*${{ matrix.id }}_amd64\.deb\)".*/\1/p')
          test -n "$url" || { echo "no ${{ matrix.id }} package in $MASTER_RELEASE"; exit 1; }
          curl -fsSL -o /tmp/master.deb "$url"
          apt-get install -y --no-install-recommends /tmp/master.deb

      - uses: actions/checkout@v4

      - name: Build the package
        shell: bash  # rip-environment is a bash script; the container's default is sh
        run: |
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory '*'
          # halcompile and the headers of the run-in-place LinuxCNC
          . /opt/linuxcnc-src/scripts/rip-environment
          scripts/build-deb.sh -o out

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.debian }}
          path: out/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ecat-v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-release while ecat is in early development.
          gh release create "${{ github.ref_name }}" out/*.deb \
            --repo "${{ github.repository }}" --prerelease \
            --title "ecat ${{ github.ref_name }}" \
            --notes "Packages of the ecat HAL component and EtherCAT Setup (ecatsetup) for LinuxCNC 2.10 or newer: debian12 for Debian 12 (bookworm), debian13 for Debian 13 (trixie). LinuxCNC 2.9 users take [ecat-v0.11](https://github.com/${{ github.repository }}/releases/tag/ecat-v0.11). 2.10 is not released and has no Debian packages yet: build it from source ([docs/development.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/development.md#linuxcnc-210)); the package needs linuxcnc-uspace 2.10 installed, and with a run-in-place build use make -C component install instead. Needs linuxcnc-ethercat-uspace 1.1 or newer from [MetalMusings/ethercat](https://github.com/MetalMusings/ethercat/releases); built against ${{ env.MASTER_RELEASE }}. The window, ecatsetup --gui, needs python3-pyqt5. To try it without disturbing your setup: [getting started](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/getting-started.md). See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)."
