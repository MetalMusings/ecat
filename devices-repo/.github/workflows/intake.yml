# Takes in quirk files posted as Discussions and keeps index.json current.
# PROTOTYPE (ecat docs/development.md "Shared device data"). The posts are
# untrusted: they reach Python only through the event file, never a shell.
name: intake
on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  discussions: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # the branch as it is now (not the commit the event saw): runs queue in the
      # concurrency group, and each must build on what the one before pushed
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Take in the post
        if: github.event_name == 'discussion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/intake.py "$GITHUB_EVENT_PATH"
      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/index.py "$GITHUB_REPOSITORY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A devices index.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Data: $GITHUB_EVENT_NAME"
            git pull -q --rebase
            git push -q
          fi
