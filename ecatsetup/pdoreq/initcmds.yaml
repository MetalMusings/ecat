# Which of an ESI file's InitCmds (Mailbox/CoE/InitCmd: SDO writes the configuring tool
# does at a state change) EtherCAT Setup puts in a slave's init-cmds
# (docs/development.md "ESI InitCmds"). Index ranges are inclusive.
take:
  - [0x2000, 0x8FFF]        # vendor objects, profile objects (0x6xxx), MDP settings (0x8xxx)
# templates the configuring tool fills in; ecat fills these at start
templates:
  "0x1C32:02": cycle-time   # SM output parameter: cycle time, the servo period in ns
  "0x1C33:02": cycle-time   # SM input parameter: cycle time
skip:
  - from: 0x1000
    to: 0x1FFF
    why: "a communication object the configuring tool fills in itself, which ecat does not"
  - from: 0xF000
    to: 0xFFFF
    why: "a device object for the configuring tool (revision, module list, diagnosis messages)"
transitions:
  on-time: [IP, PS]         # ecat writes init-cmds in PREOP, before SAFEOP: what these ask
# objects whose value a profile's choice decides, not the file
profile-owned:
  cia402: [0x6060]
