# GeRui ("Green IOT") EC1 series, open-loop CiA 402 stepper drives
# (EC1-510, EC1-530, EC1-570, EC1-872, EC1-57E, ECA1-86E). A quirk file: what
# EtherCAT Setup knows about a device beyond its ESI file, SII and dictionary.
# See docs/ecatsetup.md. From the EC1 Series manual; not tried on a drive.
# The EC-57A-7 (product 0x69673537) has other objects and is not covered.
name: GeRui EC1 series
match: {vendor: '0x00000AB5', product: ['0x00000980', '0x00000990', '0x00001000', '0x00001010',
                                         '0x00001020', '0x00001030']}

notes: |
  0x2708 clears the fault record and 0x2709 the current fault (write 1): commands,
  never settings.

  Inputs (EC1 Series manual): X0-X2 get their function in 0x2702:01-03 (1 home, 2
  positive limit, 4 negative limit; factory X0 4, X1 2, X2 1), their polarity in
  0x2701, a bit per input (1 reverses). The manual gives no factory value for
  0x2701. The EC-57A-7 (product 0x69673537) has other objects and is not covered.
  From the manual; not tried on a drive.
