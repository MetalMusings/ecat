# StepperOnline A6-EC (A6N_sAxis), a CiA 402 servo drive.
# A quirk file: what EtherCAT Setup knows about a device beyond its ESI
# file, SII and dictionary. See docs/ecatsetup.md.
name: StepperOnline A6-EC
match: {vendor: '0x00400000', product: '0x00000715'}

notes: |
  Inputs (A6-EC manual 11.3.4): DI1-DI5 get their function and logic in 0x2004
  (parameter group C04). The function is at subindex 1, 5, 9, 13, 17 (5 home, 6
  positive limit, 7 negative limit, 0 none; factory DI1 6, DI2 7, DI3 5), the logic
  at 2, 6, 10, 14, 18 (0 active low, 1 active high; factory 0). Two inputs with one
  function is error Er82.0. From the manual; not tried on a drive.
